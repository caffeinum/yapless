<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>yapless — pill equalizer color studies</title>
<style>
  :root {
    --bg: #0d0d10;
    --fg: #e8e8ec;
    --muted: #8a8a94;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 40px 32px 80px;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  }
  h1 { font-size: 22px; font-weight: 650; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 28px; }

  .controls {
    display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
    padding: 14px 18px; margin-bottom: 32px;
    background: #16161b; border: 1px solid #26262e; border-radius: 12px;
    position: sticky; top: 12px; z-index: 5;
  }
  .controls label { color: var(--muted); display: flex; align-items: center; gap: 8px; }
  input[type=range] { width: 200px; accent-color: #7C6BD6; }
  .states { display: flex; gap: 6px; }
  button {
    font: inherit; color: var(--fg); background: #24242c; border: 1px solid #34343e;
    padding: 5px 12px; border-radius: 7px; cursor: pointer;
  }
  button[aria-pressed="true"] { background: #4c3fb0; border-color: #6a5ce0; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 22px; }
  .card {
    border: 1px solid #26262e; border-radius: 14px; overflow: hidden; background: #131318;
  }
  .stage {
    height: 150px; display: grid; place-items: center;
    background-size: cover; background-position: center;
  }
  .meta { padding: 12px 16px 14px; border-top: 1px solid #26262e; }
  .name { font-weight: 600; }
  .swatches { display: flex; gap: 6px; margin: 8px 0 6px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; border: 1px solid rgba(255,255,255,.15); }
  code {
    display: block; color: var(--muted); font: 11.5px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    white-space: pre; overflow-x: auto;
  }

  /* the pill itself */
  .pill {
    display: grid; place-items: center;
    /* 1:1 with the real overlay — 168.5 x 43.2 pt at the default config size */
    width: 169px; height: 43px; border-radius: 999px;
    padding: 0 13px;
  }
  canvas { width: 100%; height: 24px; display: block; }
</style>
</head>
<body>

<h1>pill equalizer — color studies</h1>
<p class="sub">29 bars, low frequency on the left to high on the right. same geometry as <code style="display:inline">PillAnimationView.swift</code>.</p>

<div class="controls">
  <label>voice level <input id="level" type="range" min="0" max="100" value="55"></label>
  <div class="states">
    <button data-state="recording" aria-pressed="true">recording</button>
    <button data-state="processing" aria-pressed="false">processing</button>
    <button data-state="complete" aria-pressed="false">complete</button>
    <button data-state="error" aria-pressed="false">error</button>
  </div>
  <label><input id="live" type="checkbox" checked> simulate speech</label>
</div>

<div class="grid" id="grid"></div>

<script>
const THEMES = [
  {
    name: "ink — the screenshot",
    note: "closest to the reference: deep indigo core on a white glass capsule.",
    shell: "linear-gradient(#ffffff, #f0f0f3)", shellBorder: "rgba(0,0,0,.16)",
    core: "#2E1A78", edge: "#8C7FE0",
    stage: "linear-gradient(120deg,#e9e9ef,#cfd0da)"
  },
  {
    name: "graphite",
    note: "no hue at all. reads as a system control, never as branding.",
    shell: "linear-gradient(#ffffff, #eeeef1)", shellBorder: "rgba(0,0,0,.18)",
    core: "#141418", edge: "#9a9aa2",
    stage: "linear-gradient(120deg,#f4f4f6,#dcdce2)"
  },
  {
    name: "apple default",
    note: "current config defaults — primary #007AFF, secondary #5856D6.",
    shell: "linear-gradient(#ffffff, #f1f2f6)", shellBorder: "rgba(0,0,0,.14)",
    core: "#007AFF", edge: "#5856D6",
    stage: "linear-gradient(120deg,#e6eefc,#c9d8f5)"
  },
  {
    name: "terminal mint",
    note: "dark capsule for dark desktops. glows instead of floating.",
    shell: "linear-gradient(#181c1d, #0d1011)", shellBorder: "rgba(53,224,138,.45)",
    core: "#35E08A", edge: "#0E7C5A",
    stage: "linear-gradient(120deg,#101314,#1b2422)"
  },
  {
    name: "ocean",
    note: "navy glass, cyan core. the calmest of the dark options.",
    shell: "linear-gradient(#16294a, #0b1b33)", shellBorder: "rgba(56,225,255,.4)",
    core: "#38E1FF", edge: "#3B6BFF",
    stage: "linear-gradient(120deg,#0a1424,#132845)"
  },
  {
    name: "sunset",
    note: "warm cream shell. loudest personality, best on light wallpapers.",
    shell: "linear-gradient(#fffaf5, #ffeede)", shellBorder: "rgba(255,107,61,.4)",
    core: "#FF5A2D", edge: "#FF2E93",
    stage: "linear-gradient(120deg,#ffe9d9,#ffd0c2)"
  },
  {
    name: "aurora",
    note: "violet→magenta sweep. pairs with the existing glow style.",
    shell: "linear-gradient(#ffffff, #f6f0ff)", shellBorder: "rgba(123,47,247,.35)",
    core: "#7B2FF7", edge: "#F107A3",
    stage: "linear-gradient(120deg,#efe6ff,#d8c8f7)"
  },
  {
    name: "paper",
    note: "warm grey on off-white. disappears into a document.",
    shell: "linear-gradient(#fdfcfa, #f0ece4)", shellBorder: "rgba(80,66,50,.22)",
    core: "#4A4034", edge: "#B5A38A",
    stage: "linear-gradient(120deg,#f5f1e9,#e2dbcd)"
  }
];

const STATE_COLORS = {
  processing: { core: "#2689FF", edge: "#73BFFF" },
  complete:   { core: "#29C75C", edge: "#73DB8C" },
  error:      { core: "#F24040", edge: "#FF8C73" }
};

const BAR_COUNT = 29;
let state = "recording";
let level = 0.55;
let live = true;

const grid = document.getElementById("grid");
const canvases = [];

for (const theme of THEMES) {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <div class="stage" style="background:${theme.stage}">
      <div class="pill" style="background:${theme.shell};border:1px solid ${theme.shellBorder};
           box-shadow:0 6px 18px rgba(0,0,0,.28), 0 1px 2px rgba(0,0,0,.14), inset 0 1px 0 rgba(255,255,255,.7)">
        <canvas></canvas>
      </div>
    </div>
    <div class="meta">
      <div class="name">${theme.name}</div>
      <div class="swatches">
        <span class="dot" style="background:${theme.core}"></span>
        <span class="dot" style="background:${theme.edge}"></span>
      </div>
      <div style="color:var(--muted);margin-bottom:8px">${theme.note}</div>
      <code>"animation": { "style": "pill",
  "primaryColor": "${theme.core}",
  "secondaryColor": "${theme.edge}" }</code>
    </div>`;
  grid.appendChild(card);
  canvases.push({ canvas: card.querySelector("canvas"), theme });
}

document.getElementById("level").addEventListener("input", e => level = e.target.value / 100);
document.getElementById("live").addEventListener("change", e => live = e.target.checked);
document.querySelectorAll(".states button").forEach(btn => {
  btn.addEventListener("click", () => {
    state = btn.dataset.state;
    document.querySelectorAll(".states button")
      .forEach(b => b.setAttribute("aria-pressed", String(b === btn)));
  });
});

// 14 FFT bands, same count AudioCapture emits
const bands = new Array(14).fill(0);

function updateBands(t) {
  for (let i = 0; i < bands.length; i++) {
    const target = live
      ? Math.max(0, Math.sin(t * (2.4 + i * 0.37) + i) * 0.5 + 0.5) *
        Math.max(0, Math.sin(t * 1.3 + i * 0.2)) * (1 - i / 22)
      : 0;
    // rise instant, fall slow — mirrors AnimationModel.updateSpectrum
    bands[i] = target > bands[i] ? target : bands[i] + (target - bands[i]) * 0.12;
  }
}

function sample(d) {
  const pos = d * (bands.length - 1);
  const lo = Math.floor(pos), hi = Math.min(lo + 1, bands.length - 1);
  return bands[lo] + (bands[hi] - bands[lo]) * (pos - lo);
}

function energy(d, t) {
  if (state === "processing") {
    const sweep = 0.5 + 0.5 * Math.sin(t * 1.6);
    const dist = d - sweep;
    return 0.22 + Math.exp(-dist * dist * 22) * 0.7;
  }
  if (state === "complete" || state === "error") {
    return 0.12 + (Math.sin(t * 3 - d * 2.5) * 0.5 + 0.5) * 0.25;
  }
  const idle = 0.04 + (Math.sin(t * 2.2 - d * 3.4) * 0.5 + 0.5) * 0.05;
  return Math.min(1, idle + sample(d) * (0.35 + level * 0.85));
}

function mix(a, b, t) {
  const p = c => [1, 3, 5].map(i => parseInt(c.substr(i, 2), 16));
  const [r1, g1, b1] = p(a), [r2, g2, b2] = p(b);
  return `rgb(${Math.round(r1 + (r2 - r1) * t)},${Math.round(g1 + (g2 - g1) * t)},${Math.round(b1 + (b2 - b1) * t)})`;
}

function draw(t) {
  updateBands(t);

  for (const { canvas, theme } of canvases) {
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (canvas.width !== w * dpr) { canvas.width = w * dpr; canvas.height = h * dpr; }

    const ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    const override = STATE_COLORS[state];
    const core = override ? override.core : theme.core;
    const edge = override ? override.edge : theme.edge;

    const gapRatio = 0.85;
    const barW = w / (BAR_COUNT * (1 + gapRatio) - gapRatio);
    const step = barW * (1 + gapRatio);
    
    for (let i = 0; i < BAR_COUNT; i++) {
      const d = i / (BAR_COUNT - 1);            // low frequency → high, left to right
      const envelope = 0.62 + 0.38 * Math.sin(d * Math.PI);
      const half = Math.max(barW / 2, (h / 2) * envelope * (0.06 + energy(d, t) * 0.94));

      ctx.fillStyle = mix(core, edge, d);
      ctx.globalAlpha = 0.45 + envelope * 0.55;
      ctx.beginPath();
      ctx.roundRect(i * step, h / 2 - half, barW, half * 2, barW / 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
}

let start = null;
requestAnimationFrame(function loop(ts) {
  if (start === null) start = ts;
  draw((ts - start) / 1000);
  requestAnimationFrame(loop);
});
</script>
</body>
</html>
